<!-- src/app/app.html -->
<header class="barra">
  <a routerLink="/" class="marca">Arréglalo Ya</a>
  <nav>
    <a routerLink="/catalogo" routerLinkActive="activo">Catálogo</a>
    @if (auth.autenticado()) {
      <a routerLink="/perfil" routerLinkActive="activo">Perfil</a>
      <a routerLink="/calificaciones" routerLinkActive="activo">Calificaciones</a>
      <a routerLink="/espacio" routerLinkActive="activo">Cotizaciones</a>
      @if (auth.rolActivo() === 'administrador') {
        <a routerLink="/admin" routerLinkActive="activo">Administración</a>
      }
      <span class="rol">{{ auth.rolActivo() }}</span>
      <button class="btn-link" (click)="salir()">Cerrar sesión</button>
    } @else {
      <a routerLink="/login" routerLinkActive="activo">Iniciar sesión</a>
      <a routerLink="/registro" routerLinkActive="activo">Registrarse</a>
    }
  </nav>
</header>

<main class="contenido">
  <router-outlet />
</main>
